name: Update Screenshots

on:
  push:
    branches: [main]
    paths:
      - "wizard/**"
      - "webapp/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-branch-protection:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    outputs:
      protected: ${{ steps.check.outputs.protected }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Default to "protected" on any lookup failure so we fail safe
          # (skip the auto-push) rather than risk a rejected push later.
          protected=$(gh api "repos/${{ github.repository }}/branches/${{ github.ref_name }}" --jq '.protected' 2>/dev/null || echo "true")
          echo "Branch ${{ github.ref_name }} protected: $protected"
          echo "protected=$protected" >> "$GITHUB_OUTPUT"

  screenshots:
    needs: check-branch-protection
    if: >-
      ${{ !github.event.repository.is_template &&
        needs.check-branch-protection.result == 'success' &&
        needs.check-branch-protection.outputs.protected != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
      - uses: browser-actions/setup-chrome@c785b87e244131f27c9f19c1a33e2ead956ab7ce # v1
        id: chrome
        with:
          chrome-version: stable
      - name: Capture screenshots
        run: npm run screenshots
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
      - name: Commit updated screenshots
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore: update screenshots"
            git push
          else
            echo "No screenshot changes to commit."
          fi
